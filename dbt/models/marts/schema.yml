version: 2

models:
  - name: mart_rebalancing_alerts
    description: One row per active alert per station per snapshot.
    columns:
      - name: alert_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BIKE_SHORTAGE','DOCK_OVERFLOW','CRITICAL_DRAIN','IMMINENT_EMPTY']
      - name: alert_severity
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['critical','high','medium']
      - name: dispatch_priority_score
        description: Urgency in [0, 1]; higher = dispatch sooner. Empty stations score 1.0.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_cluster_health
    description: Neighborhood cluster health scores per snapshot.
    columns:
      - name: neighborhood_cluster
        tests: [not_null]
      - name: cluster_flow_direction
        tests:
          - accepted_values:
              arguments:
                values: ['strong_outflow','mild_outflow','balanced','mild_inflow','strong_inflow','unknown']
      - name: cluster_health_score
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: is_latest_snapshot
        description: TRUE only for rows from the most recent poll. Filter on this for "current state" tiles.
        tests: [not_null]

  - name: mart_pipeline_audit
    description: Hourly pipeline health. Surfaces gaps and coverage drops.
    columns:
      - name: audit_date
        tests: [not_null]
      - name: hour_is_healthy
        tests: [not_null]
      - name: audit_status
        description: healthy | system_closed | low_coverage | gap | in_progress — drives dashboard row colour.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['healthy','system_closed','low_coverage','gap','in_progress']
