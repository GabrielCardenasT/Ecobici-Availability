# =============================================================================
# dbt_project.yml
#
# dbt Core project configuration for the ECOBICI rebalancing pipeline.
# Target: BigQuery, dbt-core 1.8.x, dbt-bigquery 1.8.x
# =============================================================================

name: "ecobici_pipeline"
version: "1.0.0"
config-version: 2

profile: "ecobici_pipeline"   # matches profiles.yml profile name

# ── Path config ───────────────────────────────────────────────────────────────
model-paths:     ["models"]
analysis-paths:  ["analyses"]
test-paths:      ["tests"]
seed-paths:      ["seeds"]
macro-paths:     ["macros"]
snapshot-paths:  ["snapshots"]
target-path:     "target"
clean-targets:   ["target", "dbt_packages"]

# ── Variables — override per environment via --vars or profiles.yml ───────────
vars:
  # How far back to look when computing velocity windows.
  # "current day + 1 prior day" = safe coverage for the LAG windows.
  # Increase to 7 for the staging model in production.
  lookback_days: 2

  # Alert threshold: stations below this availability fraction trigger alerts.
  # Matches the 10% threshold from Phase 1 schema.py.
  alert_threshold_pct: 0.10

  # Neighborhood clusters — used by int_neighborhood_clusters.
  # Defined here so they can be overridden in tests without changing SQL.
  cdmx_cluster_names:
    - "Roma / Condesa"
    - "Reforma / Polanco"
    - "Centro Histórico"
    - "Doctores / Narvarte"
    - "Tlatelolco / Tepito"

# ── Materializations by layer ─────────────────────────────────────────────────
# Staging: views — cheap, always fresh, no storage cost.
#   Why not tables? Staging models are I/O pass-throughs.
#   Materializing them as tables would double storage without adding value.
#
# Intermediate: tables — these do expensive window functions.
#   Running LAG() over 26,000 rows per day as a view would re-execute the
#   full scan on every downstream query. One table write amortizes the cost.
#
# Marts: incremental tables — the final outputs grow continuously.
#   incremental + partition_by(ingested_at_utc) means each dbt run
#   only processes today's new rows, not the full history.

models:
  ecobici_pipeline:
    staging:
      +materialized: view
      +schema: raw        # writes to ecobici_dev_raw dataset (view only)

    intermediate:
      +materialized: table
      +schema: marts      # writes to ecobici_dev_marts dataset

    marts:
      +materialized: incremental
      +schema: marts
      +incremental_strategy: insert_overwrite   # BigQuery-native: replaces partitions
      +on_schema_change: append_new_columns
