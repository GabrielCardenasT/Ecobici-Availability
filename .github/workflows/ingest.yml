name: ECOBICI Ingestion Pipeline

on:
  schedule:
    # Runs every 15 minutes. GitHub doesn't reliably support 5-min intervals
    # on free accounts — 15 min is the practical minimum.
    - cron: '*/15 * * * *'

  # Lets you trigger a manual run from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCP credentials
        # Writes the secret JSON key to a temp file so the BQ client finds it
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa_key.json

      - name: Run ingestion
        run: python -m ingestion.extract --no-save
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa_key.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_TABLE_ID: ${{ secrets.BQ_TABLE_ID }}

      - name: Clean up credentials
        # Always delete the key file, even if the run failed
        if: always()
        run: rm -f /tmp/sa_key.json