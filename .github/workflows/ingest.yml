name: ECOBICI Ingestion Pipeline


on:
  repository_dispatch:
    types: [trigger-ingestion]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCP credentials
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa_key.json

      - name: Run ingestion
        run: python ingest_to_bq.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa_key.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_TABLE_ID: ${{ secrets.BQ_TABLE_ID }}

      - name: Install dbt
        run: pip install dbt-core dbt-bigquery

      - name: Run dbt models
        run: |
          cd dbt
          dbt deps
          dbt run --target ci --profiles-dir .
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa_key.json

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/sa_key.json