name: ECOBICI Ingestion Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCP credentials
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa_key.json

      - name: Run ingestion
        run: python ingest_to_bq.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa_key.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_TABLE_ID: ${{ secrets.BQ_TABLE_ID }}

      - name: Install dbt
        run: pip install dbt-core dbt-bigquery

      - name: Run dbt models
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          ecobici_pipeline:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: ${{ secrets.GCP_PROJECT_ID }}
                dataset: ecobici_dev_marts
                keyfile: /tmp/sa_key.json
                location: US
                threads: 4
                timeout_seconds: 300
          EOF
          cd dbt
          dbt deps
          dbt run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa_key.json

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/sa_key.json